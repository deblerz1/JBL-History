name: Historian live Luna evaluation
# Validate comparison dimensions alongside existing query modes.

on:
  schedule:
    - cron: '41 12 * * 1'
  workflow_dispatch:
    inputs:
      category:
        description: Question category (all starts with manager wording cases)
        type: choice
        default: all
        options:
          - all
          - analytics
          - remaining
          - manager
          - metric
          - rolling
          - list_cohort
          - rivalry
          - playoffs
          - scope
          - clarify_or_unsupported
  push:
    branches: [main]
    paths:
      - '.github/workflows/historian-live-eval.yml'

permissions:
  contents: read

concurrency:
  group: historian-live-eval
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out JBL History
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Verify evaluation key
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo 'Add OPENAI_API_KEY to JBL-History repository Actions secrets, then run this workflow again.' >> "$GITHUB_STEP_SUMMARY"
            echo 'Missing OPENAI_API_KEY repository secret.' >&2
            exit 1
          fi
      - run: npm ci
      - name: Evaluate metrics, manager composites, refusals and follow-ups
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
          JBL_LIVE_EVAL: '1'
          JBL_EVAL_LIMIT: ${{ (github.event_name == 'push' || inputs.category == 'remaining') && '50' || '10' }}
          JBL_EVAL_CATEGORY: ${{ github.event_name == 'push' && 'remaining' || inputs.category != 'all' && inputs.category || '' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            npm test -- src/lib/historian-comparison-live.test.ts
          elif [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$JBL_EVAL_CATEGORY" = "analytics" ]; then
            npm test -- src/lib/historian-conversation-live.test.ts src/lib/historian-metrics-live.test.ts src/lib/historian-outcomes-live.test.ts src/lib/historian-position-live.test.ts src/lib/historian-manager-score-live.test.ts src/lib/historian-comparison-live.test.ts
          else
            npm test -- src/lib/historian-live.test.ts
          fi
      - name: Summarize run
        if: always()
        env:
          RESULT: ${{ job.status }}
        run: |
          echo "Live evaluation job: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          echo 'Scheduled Mondays: at most 6 requests (no retries). Push/analytics: at most 39 requests for metrics, luck, conditional outcomes, positional scoring, manager composites and follow-ups. Remaining category: at most 50; other categories: at most 10. Synthetic identities only, no database access. Request limits are not dollar spending caps.' >> "$GITHUB_STEP_SUMMARY"
