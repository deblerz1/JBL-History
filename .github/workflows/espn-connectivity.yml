name: ESPN connectivity

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Seasons to probe
        required: true
        default: validation
        type: choice
        options:
          - validation
          - full-history
          - import-2025
          - backfill-2017-2026

permissions:
  contents: read

concurrency:
  group: espn-connectivity
  cancel-in-progress: false

jobs:
  probe:
    name: Probe private ESPN league
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ESPN_LEAGUE_ID: "1550163"
      ESPN_START_YEAR: "2017"
      ESPN_END_YEAR: "2026"
      ESPN_SWID: ${{ secrets.ESPN_SWID }}
      ESPN_S2: ${{ secrets.ESPN_S2 }}
      SUPABASE_URL: https://ksoecnzmisoiyyfdgyoa.supabase.co
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

    steps:
      - name: Check out JBL History
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify required secrets are configured
        shell: bash
        run: |
          set +x
          if [[ -z "$ESPN_SWID" || -z "$ESPN_S2" ]]; then
            echo "Required ESPN repository secrets are missing." >&2
            exit 2
          fi

      - name: Install pinned importer
        run: python -m pip install .

      - name: Verify JBL Supabase secret is configured
        if: inputs.scope == 'import-2025' || inputs.scope == 'backfill-2017-2026'
        shell: bash
        run: |
          set +x
          if [[ -z "$SUPABASE_SECRET_KEY" ]]; then
            echo "Required JBL Supabase repository secret is missing." >&2
            exit 2
          fi

      - name: Probe validation seasons
        if: inputs.scope == 'validation'
        run: python -m jbl_history.cli discover --year 2025 --year 2026 --details

      - name: Require both validation seasons
        if: inputs.scope == 'validation'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/espn-availability.json").read_text())
          expected = {2025, 2026}
          accessible = set(report["accessible_years"])
          missing = sorted(expected - accessible)
          if missing:
              raise SystemExit(f"Validation failed; inaccessible seasons: {missing}")
          PY

      - name: Probe full history
        if: inputs.scope == 'full-history'
        run: python -m jbl_history.cli discover --details

      - name: Import 2025 twice to verify idempotency
        if: inputs.scope == 'import-2025'
        run: |
          python -m jbl_history.cli import-season --year 2025 \
            --output reports/import-2025-first.json
          python -m jbl_history.cli import-season --year 2025 \
            --output reports/import-2025-second.json
          cmp reports/import-2025-first.json reports/import-2025-second.json

      - name: Backfill JBL history
        if: inputs.scope == 'backfill-2017-2026'
        run: python -m jbl_history.cli backfill --output reports/backfill.json

      - name: Publish sanitized job summary
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("reports/espn-availability.json")
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          import_path = Path("reports/import-2025-second.json")
          if import_path.exists():
              result = json.loads(import_path.read_text())
              summary.write_text(
                  "## 2025 JBL import\n\n"
                  f"- League ID: `{result['league_id']}`\n"
                  f"- Season: `{result['season']}`\n"
                  f"- Members: `{result['members']}`\n"
                  f"- Teams: `{result['teams']}`\n"
                  f"- Matchups: `{result['matchups']}`\n"
                  f"- Draft picks: `{result['draft_picks']}`\n"
                  f"- Weekly roster rows: `{result['roster_snapshots']}`\n"
                  f"- Transactions: `{result['transactions']}`\n"
                  "- Idempotency: `passed`\n"
              )
              raise SystemExit(0)

          backfill_path = Path("reports/backfill.json")
          if backfill_path.exists():
              result = json.loads(backfill_path.read_text())
              summary.write_text(
                  "## JBL historical backfill\n\n"
                  f"- Requested: `{result['requested_seasons']}`\n"
                  f"- Succeeded: `{result['succeeded_seasons']}`\n"
                  f"- Failed: `{result['failed_seasons']}`\n"
              )
              raise SystemExit(0)

          if not path.exists():
              summary.write_text("## ESPN connectivity\n\nNo availability report was produced.\n")
              raise SystemExit(0)

          report = json.loads(path.read_text())
          lines = [
              "## ESPN connectivity",
              "",
              f"- League ID: `{report['league_id']}`",
              f"- Requested seasons: `{report['requested_years']}`",
              f"- Accessible seasons: `{report['accessible_years']}`",
              "",
              "| Season | Access | Teams | Members | Draft | Box scores | Transactions |",
              "| ---: | :---: | ---: | ---: | ---: | :---: | :---: |",
          ]
          for season in report["seasons"]:
              probes = season["probes"]
              def cell(name):
                  probe = probes.get(name)
                  if not probe or not probe["available"]:
                      return "—"
                  count = probe.get("count")
                  return "✓" if count is None else str(count)

              lines.append(
                  "| {year} | {access} | {teams} | {members} | {draft} | {boxes} | {tx} |".format(
                      year=season["year"],
                      access="✓" if season["accessible"] else "✗",
                      teams=cell("teams"),
                      members=cell("members"),
                      draft=cell("draft"),
                      boxes=cell("weekly_box_scores"),
                      tx=cell("transactions"),
                  )
              )
          lines.extend([
              "",
              "The private report was not uploaded as an artifact.",
          ])
          summary.write_text("\n".join(lines) + "\n")
          PY
